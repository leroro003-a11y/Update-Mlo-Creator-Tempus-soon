<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mlo-token" content="__TOKEN__">
<title>MLO Creator</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="splash" aria-label="MLO Creator" role="status">
  <div class="splash-glow"></div>
  <div class="splash-core">
    <img class="splash-logo" src="logo.png" alt="" width="128" height="128">
    <div class="splash-name">MLO <b>Creator</b></div>
    <div class="splash-bar"><span></span></div>
  </div>
</div>
<script src="js/splash.js"></script>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="hudlabel"></div>

  <header id="top">
    <div class="brand"><img src="logo.png" alt="" width="24" height="24">MLO<span>Creator</span></div>
    <div class="pname"><input id="projname" spellcheck="false" maxlength="60" title="Project name"><span id="savestate"></span></div>
    <nav id="tabs"></nav>
    <div class="actions">
      <select id="language-select" class="language-select" data-noi18n title="Language"></select>
      <button class="btn icon" id="b-undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="lbl">Undo</span></button>
      <button class="btn icon" id="b-redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h3"/></svg><span class="lbl">Redo</span></button>
      <span class="sep"></span>
      <button class="btn" id="b-save" title="Save the project now (Ctrl+S). It also saves by itself."><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h11l3 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v5h8V3"/><path d="M7 21v-7h10v7"/></svg><span class="lbl">Save</span></button>
      <button class="btn" id="b-new" title="Start a new project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New project</span></button>
      <button class="btn" id="b-share" title="Share project"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.7 6.8-4.3M8.6 13.3l6.8 4.3"/></svg><span class="lbl">Share</span></button>
      <button class="btn" id="b-projects" title="Your projects"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="lbl">Projects</span></button>
      <button class="btn primary" id="b-export" title="Export the resource"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg><span class="lbl">Export</span></button>
    </div>
  </header>

  <nav id="rail" aria-label="Tools"></nav>
  <aside id="left" class="panel"></aside>
  <aside id="right" class="panel"></aside>
  <div id="viewbar" hidden></div>
  <section id="bench" class="panel"></section>

  <div id="keys"></div>
  <footer id="status"><div id="sleft"></div><span id="hint"></span><span class="grow"></span><span id="stats"></span><button id="helpbtn" class="btn sm" title="Help (F1)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.9M12 17.2h.01"/></svg>Help <kbd>F1</kbd></button></footer>
  <div id="toasts"></div>
  <div id="modal" hidden></div>
</div>
<script src="js/errors.js"></script>
<script src="js/util.js"></script>
<script src="js/i18n-data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-extra.js"></script>
<script src="js/textures.js"></script>
<script src="js/mesher.js"></script>
<script src="js/render.js"></script>
<script src="js/model.js"></script>
<script src="js/tools.js"></script>
<script src="js/shell.js"></script>
<script src="js/shelltools.js"></script>
<script src="js/face-deletions.js"></script>
<script src="js/importmodel.js"></script>
<script src="js/opening-geometry.js"></script>
<script src="js/importtools.js"></script>
<script src="js/fitmodels.js"></script>
<script src="js/plants.js"></script>
<script src="js/furniture.js"></script>
<script src="js/stairs.js"></script>
<script src="js/clipboard.js"></script>
<script src="js/walk.js"></script>
<script src="js/ui.js"></script>
<script src="js/layout.js"></script>
<script src="js/vanillaui.js"></script>
<script src="js/buildings.js"></script>
<script src="js/gamemlo.js"></script>
<script src="js/gamewalls.js"></script>
<script src="js/gameedit.js"></script>
<script src="js/proplights.js"></script>
<script src="js/importui.js"></script>
<script src="js/figure.js"></script>
<script src="js/hints.js"></script>
<script src="js/siteupload.js"></script>
<script src="js/app.js"></script>
<script src="js/lang-switch.js"></script>
<script src="js/studio-config.js"></script>
<script src="js/studio.js"></script>
</body>
</html>
